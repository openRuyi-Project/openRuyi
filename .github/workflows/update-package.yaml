name: update package to obs
on:
  push:
    branches: [main]
    paths:
     - 'SPECS/**'
concurrency:
  group: update_package
  queue: max
  cancel-in-progress: false

jobs:
  build:
    runs-on: [ubuntu-latest]
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Install tools
      run: |
        . /etc/os-release
        obs_repo="https://download.opensuse.org/repositories/openSUSE:/Tools/xUbuntu_${VERSION_ID}"
        sudo install -d -m 0755 /etc/apt/keyrings
        sudo wget -qO /etc/apt/keyrings/obs.asc "${obs_repo}/Release.key"
        sudo chmod 0644 /etc/apt/keyrings/obs.asc
        echo "deb [signed-by=/etc/apt/keyrings/obs.asc] ${obs_repo}/ /" | sudo tee /etc/apt/sources.list.d/obs.list
        sudo apt-get update
        sudo apt-get install -y osc obs-build libwww-perl libxml-parser-perl
    - name: Setup osc config
      run: |
        set -x
        mkdir -p ~/.config/osc
        cat > ~/.config/osc/oscrc <<EOF
        [general]
        apiurl = https://build.openruyi.cn
        [https://build.openruyi.cn]
        pass = ${{ secrets.BOT }}
        user = a-bot
        credentials_mgr_class=osc.credentials.PlaintextConfigFileCredentialsManager
        EOF
    - name: run script
      run: |
        ./scripts/update-package ${{ github.event.before }} ${{ github.sha }}
