[package]
edition = "2024"
name = "libvault"
version = "0.4.0"
authors = ["Eli Ma <eli@patch.sh>"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "the libvault is modified from RustyVault"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gitmono-dev/libvault-rs"

[features]
crypto_adaptor_openssl = [
    "dep:openssl",
    "dep:openssl-sys",
]
crypto_adaptor_tongsuo = [
    "dep:openssl",
    "dep:openssl-sys",
]
default = ["crypto_adaptor_openssl"]
storage_pg = ["sqlx/postgres"]
