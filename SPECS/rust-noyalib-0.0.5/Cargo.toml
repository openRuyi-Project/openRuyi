[package]
edition = "2024"
rust-version = "1.85.0"
name = "noyalib"
version = "0.0.5"
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]
build = "build.rs"
include = [
    "/benches/**",
    "/build.rs",
    "/Cargo.toml",
    "/examples/**",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
    "/src/**",
    "/tests/**",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A pure Rust YAML library with zero unsafe code and full serde integration"
homepage = "https://github.com/sebastienrousseau/noyalib"
documentation = "https://docs.rs/noyalib"
readme = "README.md"
keywords = [
    "yaml",
    "serde",
    "serialization",
    "parser",
    "safe",
]
categories = [
    "encoding",
    "parser-implementations",
    "config",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sebastienrousseau/noyalib"
resolver = "2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[package.metadata.clippy]
warn-lints = [
    "clippy::all",
    "clippy::pedantic",
    "clippy::cargo",
    "clippy::nursery",
]

[features]
ariadne = ["dep:ariadne"]
compare-saphyr = ["dep:serde-saphyr"]
compat-serde-yaml = []
default = [
    "std",
    "fast-int",
    "fast-float",
    "strict-deserialise",
]
fast-float = ["dep:ryu"]
fast-int = ["dep:itoa"]
figment = [
    "dep:figment",
    "std",
]
garde = ["dep:garde"]
include = []
include_fs = [
    "include",
    "std",
]
miette = ["dep:miette"]
minimal = ["std"]
nightly-simd = ["simd"]
noyavalidate = [
    "std",
    "miette",
    "miette/fancy",
    "validate-schema",
]
parallel = [
    "dep:rayon",
    "std",
]
robotics = []
schema = [
    "dep:schemars",
    "dep:serde_json",
]
simd = []
std = ["serde/std"]
strict-deserialise = ["dep:serde_ignored"]
validate-schema = [
    "schema",
    "dep:jsonschema",
]
validator = ["dep:validator"]
wasm-opt = []

