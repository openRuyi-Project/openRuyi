[dependencies.ariadne]
version = "0.5"
optional = true
default-features = false

[dependencies.figment]
version = "0.10"
features = ["env"]
optional = true

[dependencies.garde]
version = "0.22"
features = ["derive"]
optional = true
default-features = false

[dependencies.indexmap]
version = ">=2, <3"
features = ["serde"]

[dependencies.itoa]
version = "1"
optional = true

[dependencies.jsonschema]
version = "0.33"
optional = true
default-features = false

[dependencies.memchr]
version = "2.7"

[dependencies.miette]
version = "7"
optional = true

[dependencies.rayon]
version = "1.10"
optional = true

[dependencies.rustc-hash]
version = ">=2, <3"

[dependencies.ryu]
version = "1"
optional = true

[dependencies.schemars]
version = "1.2"
features = [
    "derive",
    "std",
]
optional = true
default-features = false

[dependencies.serde]
version = "1.0"
features = [
    "derive",
    "alloc",
]
default-features = false

[dependencies.serde-saphyr]
version = "0.0"
optional = true

[dependencies.serde_ignored]
version = "0.1"
optional = true

[dependencies.serde_json]
version = "1.0"
optional = true

[dependencies.smallvec]
version = "1.13"
default-features = false

[dependencies.validator]
version = "0.19"
features = ["derive"]
optional = true

[dev-dependencies.criterion]
version = "0.5"

[dev-dependencies.proptest]
version = "1.11"

[dev-dependencies.rust-yaml]
version = "0.0.5"

[dev-dependencies.serde_bytes]
version = "0.11"

[dev-dependencies.serde_ignored]
version = "0.1"

[dev-dependencies.serde_json]
