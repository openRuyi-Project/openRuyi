[package]
edition = "2021"
rust-version = "1.85"
name = "sequoia-cert-store"
version = "0.7.6"
authors = [
    "Neal H. Walfield <neal@sequoia-pgp.org>",
    "Justus Winter <justus@sequoia-pgp.org>",
]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
