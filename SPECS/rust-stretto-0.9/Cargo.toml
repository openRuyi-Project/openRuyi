[package]
edition = "2024"
rust-version = "1.85.0"
name = "stretto"
version = "0.9.0"
authors = ["Al Liu <scygliu1@gmail.com>"]
build = "build.rs"
exclude = [
    "**/*.json",
    "**/*.go",
    "**/*.mod",
    "**/*.sum",
    "benches/*",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Stretto is a high performance thread-safe memory-bound Rust cache."
homepage = "https://github.com/al8n/stretto"
documentation = "https://docs.rs/stretto/"
readme = "README.md"
keywords = [
    "cache",
    "caching",
    "concurrent",
    "tinylfu",
    "async",
]
categories = [
    "caching",
    "concurrency",
    "asynchronous",
    "data-structures",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/al8n/stretto.git"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
async = [
    "async-channel",
    "event-listener",
    "agnostic-lite/time",
    "futures/default",
    "wg/future",
    "crossbeam-channel",
]
default = ["sync"]
send_guard = ["parking_lot/send_guard"]
serde = [
    "dep:serde",
    "dep:serde_json",
]
smol = [
    "async",
    "agnostic-lite/smol",
]
sync = ["crossbeam-channel"]
tokio = [
    "async",
    "agnostic-lite/tokio",
]

[lib]
name = "stretto"
path = "src/lib.rs"

[[example]]
name = "async_bench"
path = "examples/async_bench.rs"
required-features = ["tokio"]

[[example]]
name = "get_only_bench"
path = "examples/get_only_bench.rs"
required-features = [
    "tokio",
    "sync",
]

[[example]]
name = "insert_only_bench"
path = "examples/insert_only_bench.rs"
required-features = [
    "tokio",
    "sync",
]

[[example]]
name = "smol"
path = "examples/smol.rs"
required-features = ["smol"]

[[example]]
name = "sync"
path = "examples/sync.rs"
required-features = ["sync"]

[[example]]
name = "sync_bench"
path = "examples/sync_bench.rs"
required-features = ["sync"]

[[example]]
name = "tokio"
path = "examples/tokio.rs"
required-features = ["tokio"]

[dependencies.agnostic-lite]
version = "0.6"
optional = true

[dependencies.async-channel]
version = "2"
optional = true

[dependencies.atomic]
version = "0.6"

[dependencies.crossbeam-channel]
version = "0.5"
optional = true

[dependencies.crossbeam-utils]
version = "0.8"

[dependencies.event-listener]
version = "5"
optional = true

[dependencies.futures]
version = "0.3"
optional = true

[dependencies.parking_lot]
version = "0.12"

[dependencies.rand]
version = "0.10"

[dependencies.seahash]
version = "4.1"

[dependencies.serde]
version = "1"
features = ["derive"]
optional = true

[dependencies.serde_json]
version = "1"
optional = true

[dependencies.thiserror]
version = "2"

[dependencies.tracing]
version = "0.1"

[dependencies.wg]
version = "1"

[dependencies.xxhash-rust]
version = "0.8"
features = ["xxh64"]

[dev-dependencies.agnostic-lite]
version = "0.6"
features = ["tokio"]

[dev-dependencies.criterion]
version = "0.8"
features = ["html_reports"]

[dev-dependencies.serde]
version = "1"
features = ["derive"]

[dev-dependencies.serde_json]
version = "1"

[dev-dependencies.tokio]
version = "1"
features = ["full"]

[target.'cfg(target_family = "wasm")'.dependencies.getrandom]
version = "0.4"
features = ["wasm_js"]

[lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(all_tests)",
    "cfg(tarpaulin)",
]
