[package]
edition = "2021"
rust-version = "1.85"
name = "sqz"
version = "0.1.0"
authors = [
    "Azul <azul@sequoia-pgp.org>",
    "Heiko Schaefer <heiko@schaefer.name>",
    "Igor Matuszewski <igor@sequoia-pgp.org>",
    "Justus Winter <justus@sequoia-pgp.org>",
    "Kai Michaelis <kai@sequoia-pgp.org>",
    "Lars Wirzenius <liw@sequoia-pgp.org>",
    "Malte Meiboom <malte@sequoia-pgp.org>",
    "Neal H. Walfield <neal@sequoia-pgp.org>",
    "Nora Widdecke <nora@sequoia-pgp.org>",
    "Wiktor Kwapisiewicz <wiktor@sequoia-pgp.org>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A high-Level library for Sequoia PGP"
homepage = "https://sequoia-pgp.org/"
documentation = "https://docs.rs/sqz"
readme = "README.md"
keywords = [
    "cryptography",
    "openpgp",
    "pgp",
    "encryption",
    "signing",
]
categories = [
    "cryptography",
    "authentication",
]
license = "LGPL-2.0-or-later"
repository = "https://gitlab.com/sequoia-pgp/sequoia-sq"
resolver = "3"

[package.metadata.docs.rs]
features = ["sequoia-openpgp/default"]

[badges.gitlab]
repository = "sequoia-pgp/sequoia-sq"

[badges.maintenance]
status = "actively-developed"

[features]
allow-experimental-crypto = ["sequoia-openpgp/allow-experimental-crypto"]
allow-variable-time-crypto = ["sequoia-openpgp/allow-variable-time-crypto"]
clap = ["dep:clap"]
crypto-botan = ["sequoia-openpgp/crypto-botan"]
crypto-botan2 = ["sequoia-openpgp/crypto-botan2"]
crypto-cng = ["sequoia-openpgp/crypto-cng"]
crypto-nettle = ["sequoia-openpgp/crypto-nettle"]
crypto-openssl = ["sequoia-openpgp/crypto-openssl"]
crypto-rust = ["sequoia-openpgp/crypto-rust"]
default = ["crypto-nettle"]
net = [
    "dep:sequoia-net",
    "dep:tokio",
]

[lib]
name = "sqz"
path = "src/lib.rs"

[dependencies.aho-corasick]
version = "1"

[dependencies.anyhow]
version = "1.0.18"

[dependencies.chrono]
version = "0.4.38"

[dependencies.clap]
