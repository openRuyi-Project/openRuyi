    "smawk",
    "unicode-width",
]
default-features = false

[dependencies.thiserror]
version = ">=1, <3"

[dependencies.tokio]
version = "1.13.1"
optional = true

[dependencies.toml_edit]
version = "0.22"
features = [
    "display",
    "parse",
]
default-features = false

[dependencies.url]
version = "2.1"

[dev-dependencies.tempfile]
