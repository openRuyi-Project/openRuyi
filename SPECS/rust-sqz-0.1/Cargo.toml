[dependencies.humantime]
version = "2"

[dependencies.libc]
version = "0.2"

[dependencies.once_cell]
version = "1.17"

[dependencies.regex]
version = "1"

[dependencies.rusqlite]
version = ">=0.31, <0.41"

[dependencies.sequoia-autocrypt]
version = "0.26"
default-features = false

[dependencies.sequoia-cert-store]
version = "0.7.6"
default-features = false

[dependencies.sequoia-directories]
version = "0.1"

[dependencies.sequoia-ipc]
version = "0.36"
