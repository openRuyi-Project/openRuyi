features = [
    "derive",
    "string",
]
optional = true

[dependencies.crossbeam]
version = "0.8.1"

[dependencies.dirs]
version = "6"

[dependencies.filetime]
version = "0.2"

[dependencies.fs_extra]
version = "1"

[dependencies.gethostname]
