[package]
name = "lssbi"
version = "0.0.1"
edition = "2024"
build = "build.rs"
description = "List information about the active RISC-V SBI environment."
documentation = "https://docs.rs/lssbi"
repository = "https://github.com/rustsbi/lssbi"
authors = ["Zhouqi Jiang <luojia@rustsbi.com>"]
license = "MIT OR MulanPSL-2.0"
readme = "README.md"
keywords = ["riscv", "sbi", "linux"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
clap = { version = "4.5", default-features = false, features = ["cargo", "derive", "help", "std", "usage"] }
jep106 = { version = "0.3", default-features = false }
sbi-spec = "0.0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-width = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gettext-rs = { version = "0.8", features = ["gettext-system"] }
libc = "0.2"

[build-dependencies]
polib = "0.3"
