[package]
edition = "2021"
rust-version = "1.85"
name = "sequoia-sq"
version = "1.5.0"
authors = [
    "Azul <azul@sequoia-pgp.org>",
    "Heiko Schaefer <heiko@schaefer.name>",
    "Igor Matuszewski <igor@sequoia-pgp.org>",
    "Justus Winter <justus@sequoia-pgp.org>",
    "Kai Michaelis <kai@sequoia-pgp.org>",
    "Lars Wirzenius <liw@sequoia-pgp.org>",
    "Malte Meiboom <malte@sequoia-pgp.org>",
    "Neal H. Walfield <neal@sequoia-pgp.org>",
    "Nora Widdecke <nora@sequoia-pgp.org>",
    "Wiktor Kwapisiewicz <wiktor@sequoia-pgp.org>",
]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Command-line frontends for Sequoia"
homepage = "https://sequoia-pgp.org/"
documentation = "https://docs.rs/sequoia-sq"
readme = "README.md"
keywords = [
    "cryptography",
    "openpgp",
    "pgp",
    "encryption",
    "signing",
]
categories = [
    "cryptography",
    "authentication",
    "command-line-utilities",
]
license = "LGPL-2.0-or-later"
repository = "https://gitlab.com/sequoia-pgp/sequoia-sq"
resolver = "3"

[package.metadata.docs.rs]
features = ["sequoia-openpgp/default"]

[badges.gitlab]
repository = "sequoia-pgp/sequoia-sq"

[badges.maintenance]
status = "actively-developed"

[features]
allow-experimental-crypto = ["sqz/allow-experimental-crypto"]
allow-variable-time-crypto = ["sqz/allow-variable-time-crypto"]
crypto-botan = ["sqz/crypto-botan"]
crypto-botan2 = ["sqz/crypto-botan2"]
crypto-cng = ["sqz/crypto-cng"]
crypto-nettle = ["sqz/crypto-nettle"]
crypto-openssl = ["sqz/crypto-openssl"]
crypto-rust = ["sqz/crypto-rust"]
default = ["sqz/default"]
subplot = [
    "culpa",
    "subplot-build",
    "subplotlib",
]

[[bin]]
name = "sq"
path = "src/main.rs"
bench = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "sq-subplot"
path = "tests/sq-subplot.rs"
required-features = ["subplot"]

