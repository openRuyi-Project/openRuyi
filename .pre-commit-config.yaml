repos:
-   repo: local
    hooks:
    # ------------------------------------------------------------------
    # All spec-file checks run through the unified pre-commit.py runner.
    # Hook IDs must match the `hook_id` class variable in scripts/pre-commit.py.
    # ------------------------------------------------------------------
    -  id: no-group-tag
       name: "check no Group tag"
       language: python
       entry: scripts/pre-commit.py no-group-tag
       files: \.spec$
       pass_filenames: true
    -  id: autorelease
       name: "check autorelease macro"
       language: python
       entry: scripts/pre-commit.py autorelease
       files: \.spec$
       pass_filenames: true
    -  id: check-files-pkgconfig-file
       name: "check %files pkgconfig files is not *"
       language: python
       entry: scripts/pre-commit.py check-files-pkgconfig-file
       files: \.spec$
       pass_filenames: true
    -  id: autochangelog
       name: "check autochangelog macro"
       language: python
       entry: scripts/pre-commit.py autochangelog
       files: \.spec$
       pass_filenames: true
    -  id: format-spacing
       name: "Check format spacing"
       language: python
       entry: scripts/pre-commit.py format-spacing
       files: \.spec$
       pass_filenames: true
    -  id: python-name
       name: "python spec name should follow PEP 503"
       language: python
       entry: scripts/pre-commit.py python-name
       files: python-(?!([a-z0-9]|[a-z0-9][a-z0-9._-]*[a-z0-9])).*\.spec$
       pass_filenames: true
    -  id: no-entries-directly-under-SPECS
       name: "SPECS may only contain subdirectories"
       language: python
       entry: scripts/pre-commit.py no-entries-directly-under-SPECS
       files: '^SPECS/[^/]+$'
       pass_filenames: true
    -  id: dont-add-constraints-to-repo
       name: "Don't add _constraints to spec directory"
       language: python
       entry: scripts/pre-commit.py dont-add-constraints-to-repo
       files: ^SPECS/.*/_constraints$
       pass_filenames: true
    -  id: sourcewithRemoteAsset
       name: "check Source with #!RemoteAsset"
       language: python
       entry: scripts/pre-commit.py sourcewithRemoteAsset
       files: \.spec$
       pass_filenames: true
    -  id: check-rust-cargo-toml
       name: "Check Cargo.toml for crate related specs"
       language: python
       entry: scripts/pre-commit.py check-rust-cargo-toml
       files: ^SPECS/[^/]+/(Cargo\.toml|[^/]+\.spec)$
       pass_filenames: true
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
        files: \.spec$
    -   id: end-of-file-fixer
        files: \.spec$
    -   id: check-added-large-files
    -   id: check-merge-conflict
    -   id: check-case-conflict
    -   id: check-toml
    -   id: check-yaml
-   repo: local
    hooks:
    -   id: reuse-add-annotate
        name: "Add REUSE license headers"
        language: python
        entry: scripts/pre-commit.py reuse-add-annotate
        files: \.spec$
        pass_filenames: true
        additional_dependencies: ['reuse>=6.0.0']
    -   id: check-autotools-buildrequires
        name: "Check autotools BuildRequires"
        language: python
        entry: scripts/pre-commit.py check-autotools-buildrequires
        files: \.spec$
        pass_filenames: true
        additional_dependencies: ['reuse>=6.0.0']
